  - {type: line-break, offset: 6714, content: '', id: KR6i0301_T_004-0358a02, ed: T, 'n': 0358a02}
  - {type: variant, offset: 6714, length: 428, content: '金光明經囑累品第十九

      爾時釋迦牟尼佛，從三昧起現大神力，以右手摩諸菩薩摩訶薩頂，與諸天王及諸龍王、二十八部散脂鬼神大將軍等，而作是言：「我於無量百千萬億恒河沙劫，修習是金光明微妙經典，汝等當受持讀誦廣宣此法，復於閻浮提內無令斷絕。若有善男子、善女人，於未來世中有受持讀誦此經典者，汝等諸天常當擁護，當知是人於未來世無量百千人天之中常受快樂，於未來世值遇諸佛，疾得證成阿耨多羅三藐三菩提。」

      爾時諸大菩薩，及天龍王二十八部散脂大將等，即從座起到於佛前，五體投地俱發聲言：「如世尊勅，當具奉行。」如是三白：「如世尊勅，當具奉行。」於是散脂大將等，而白佛言：「如世尊勅，若未來世中有受持是經，若自書若使人書，我當【CB】【麗-CB】，等【大】當K40n1465_p0657c12T16n0664_p0402a11等與此二十八部諸鬼神等，常當隨侍擁護隱蔽其身，是說法者皆悉消滅諸惡令得安隱，願不有慮。」爾時釋迦牟尼佛，現大神力，十方無量世界悉皆六種震動，是時諸佛皆大歡喜；囑累是經故，讚美持法者，現無量神力。於是無量無邊阿僧祇菩薩摩訶薩大眾及信相菩薩，金光、金藏、常悲、法上等，及四天大王、十千天子，與道場菩提樹神、堅牢地神及一切世間天人阿脩羅等，聞佛所說，皆發無上菩提之道，踊躍歡喜作禮而去。', 明: ''}
