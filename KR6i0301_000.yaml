front:
  text: 金光明經序真定府十方洪濟禪院住持傳法慈覺大師宗賾述夫靈心絕待泯萬物而獨存妙行難思諸緣普現則實際理地雖不受於一毫而事相門中不捨於一法故如來出世說金光明經依清淨心建解脫行顯出塵之經卷永廓迷情示伏藏之寶王頓圓大用夫以信相為起教之人則菩薩無滯空之行於堅牢有贊空之頌則法身非有相之求性相該通有無互建則一經之要義在於斯至於明諸佛法性之源探如來壽量之本金光普照發揚一切智門金鼓騰聲顯示無邊妙用則菩薩發行之源也懺除罪障本如夢之法門讚歎如來舉修行之妙果摩訶薩埵之飼虎能捨能行長者流水之濟魚有始有卒則菩薩依真之行也譬之明月當天影沈眾水真金作器體應萬形主伴圓融一多自在能於一法受一切法則信如來之祕藏實為三界之寶乘莊嚴性海之門趣向覺王之本是以十千天子聞而頓證於菩提一切眾生入者皆同於甘露則見聞隨喜讀誦受持於一念具了無上法門者豈小緣哉凡我同儔勉思佛意元豐四年三月十五日序
